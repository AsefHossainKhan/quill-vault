# ─────────────────────────────────────────────────────────────
# QuillVault — Docker Hub Image Override
# ─────────────────────────────────────────────────────────────
# Use this instead of building from source when you have
# pre-built images on Docker Hub.
#
# Usage:
#   # CPU mode from hub:
#   docker compose -f docker-compose.yml -f docker-compose.hub.yml up
#
#   # GPU mode from hub:
#   docker compose -f docker-compose.yml -f docker-compose.hub.yml -f docker-compose.gpu.yml up
#
# Set your image name:
#   export DOCKER_USER=yourusername
#   docker compose -f docker-compose.yml -f docker-compose.hub.yml up
# ─────────────────────────────────────────────────────────────

services:
  backend-api:
    image: ${DOCKER_USER:-yourusername}/quillvault-backend:${TAG:-latest}
    build: !reset null

  celery-worker:
    image: ${DOCKER_USER:-yourusername}/quillvault-backend:${TAG:-latest}
    build: !reset null
