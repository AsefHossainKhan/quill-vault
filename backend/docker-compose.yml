# ─────────────────────────────────────────────────────────────
# QuillVault — Docker Compose (CPU mode — default)
# ─────────────────────────────────────────────────────────────
# Usage:
#   CPU mode:  docker compose up --build
#   GPU mode:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# ─────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-quillvault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI Backend (CPU mode) ──────────────────────────────
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override for CPU mode
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: float32
      # Service type: api only
      SERVICE_TYPE: api
      # Database points to docker postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-quillvault}
      # Redis/Celery points to docker redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - audio_data:/app/data/audio
      - hf_cache:/app/.cache/huggingface
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker (CPU mode) ───────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override for CPU mode
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: float32
      # Service type: celery only
      SERVICE_TYPE: celery
      # Database points to docker postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-quillvault}
      # Redis/Celery points to docker redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Celery tuning
      CELERY_CONCURRENCY: 1
      CELERY_POOL: prefork
    volumes:
      - audio_data:/app/data/audio
      - hf_cache:/app/.cache/huggingface
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  audio_data:
  hf_cache:       # Persist downloaded models across container restarts
  backend_logs:
