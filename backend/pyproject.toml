[project]
name = "quillvault-api"
version = "0.1.0"
description = "QuillVault v2 — FastAPI backend for audio transcription and meeting notes"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",

    # Database
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.14.0",

    # Celery
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<5.0",

    # Validation / Settings
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pydantic[email]>=2.0,<3.0",
    "email-validator>=2.0,<3.0",

    # ML — Transcription
    "faster-whisper>=1.0.0",

    # ML — Diarization
    "pyannote.audio>=3.1.0",

    # ML — Alignment
    "whisperx>=3.3.0",

    # ML — Audio processing
    "librosa>=0.10.0",
    "noisereduce>=3.0.0",
    "numpy>=1.26.0",
    "torch>=2.0.0",

    # LLM
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.2.0",
    "httpx>=0.27.0",

    # RAG embeddings
    "sentence-transformers>=3.0.0",
    "transformers<4.46",  # Pin for PyTorch 2.3.x compat (4.46+ requires torch>=2.4)

    # Logging
    "structlog>=24.0.0",

    # Email
    "aiosmtplib>=3.0.0",

    # Utils
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (loads ML models). Deselect with '-m not slow'.",
]
