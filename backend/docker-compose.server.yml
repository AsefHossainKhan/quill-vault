# ─────────────────────────────────────────────────────────────
# QuillVault — Production / Server Compose (pull from Docker Hub)
# ─────────────────────────────────────────────────────────────
# This file is for running pre-built images from Docker Hub.
# No source code needed — just this file + .env
#
# Setup on server:
#   1. Copy this file and .env.docker to the server
#   2. cp .env.docker .env && nano .env
#   3. docker compose up -d
#
# GPU mode:
#   Set WHISPER_DEVICE=cuda and WHISPER_COMPUTE_TYPE=float16 in .env
#   Then: docker compose up -d
# ─────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: qv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-quillvault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: qv-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI Backend ─────────────────────────────────────────
  backend-api:
    image: ${DOCKER_USER:-yourusername}/quillvault-backend:${TAG:-latest}
    container_name: qv-api
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_TYPE: api
      # API server doesn't run ML — force CPU to avoid GPU errors
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: float32
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-quillvault}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - audio_data:/app/data/audio
      - hf_cache:/app/.cache/huggingface
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker (does all the ML work) ────────────────────
  celery-worker:
    image: ${DOCKER_USER:-yourusername}/quillvault-backend:${TAG:-latest}
    container_name: qv-celery
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_TYPE: celery
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-quillvault}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_CONCURRENCY: 1
      CELERY_POOL: prefork
    volumes:
      - audio_data:/app/data/audio
      - hf_cache:/app/.cache/huggingface
      - backend_logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  audio_data:
  hf_cache:
  backend_logs:
